name: Deploy storefront demo

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: github-pages-demo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Remove contact details from demo settings
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const file = 'src/store-settings.json'
          const settings = JSON.parse(readFileSync(file, 'utf8'))
          settings.whatsapp = ''
          settings.email = ''
          settings.location = ''
          writeFileSync(file, JSON.stringify(settings))
          NODE
      - run: npm run build
        env:
          VITE_STOREFRONT_DEMO: 'true'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
